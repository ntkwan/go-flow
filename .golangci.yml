version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - godot
  settings:
    revive:
      rules:
        - name: exported
    godot:
      scope: declarations

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - revive
    - text: "should have a package comment"
      linters:
        - revive

run:
  timeout: 5m
  tests: true

