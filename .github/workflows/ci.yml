name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Conventional Commits
        run: |
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+$|^Initial commit$|^Merge .+$"
          FAILED=0
          if [ -n "$GITHUB_BASE_REF" ]; then
            COMMITS=$(git log --no-merges --format=%s "origin/$GITHUB_BASE_REF..HEAD")
          else
            COMMITS=$(git log --no-merges --format=%s -n 1 HEAD)
          fi
          while IFS= read -r msg; do
            if [ -n "$msg" ] && ! echo "$msg" | grep -Eq "$PATTERN"; then
              echo "Non-conventional commit: $msg"
              FAILED=1
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All commit messages conform to Conventional Commits standard"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - name: Verify Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - name: Run Static Analysis
        shell: bash
        run: |
          go vet ./...
          (cd examples && go vet ./...)
          (cd cmd/gen-diagrams && go vet .)
          (cd test && go vet ./...)
      - name: Run GolangCI-Lint
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          GOPATH=$(go env GOPATH)
          "$GOPATH/bin/golangci-lint" run ./...
          (cd examples && "$GOPATH/bin/golangci-lint" run ./...)
          (cd cmd/gen-diagrams && "$GOPATH/bin/golangci-lint" run ./...)
          (cd test && "$GOPATH/bin/golangci-lint" run ./...)

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24', '1.25', '1.26', '1.27']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Build All Packages
        shell: bash
        run: |
          go build ./...
          (cd examples && go build ./...)
          (cd cmd/gen-diagrams && go build .)

      - name: Run Tests with Race Detector
        shell: bash
        run: |
          go test -v -race ./...
          (cd test && go test -v -race ./...)

      - name: Run Allocation Invariant Tests
        shell: bash
        run: |
          cd test
          go test -v ./alloc/...

      - name: Run Goroutine Leak Detection
        shell: bash
        run: |
          cd test/leak
          go test -v ./...

      - name: Run UAT Acceptance Tests (BDD)
        shell: bash
        run: |
          cd test/bdd
          go test -v ./...

      - name: Run Fuzz Smoke Tests
        shell: bash
        run: |
          cd test
          go test -fuzz=FuzzDAG -fuzztime=3s ./fuzz
          go test -fuzz=FuzzChunk -fuzztime=3s ./fuzz
          go test -fuzz=FuzzPipeSeq -fuzztime=3s ./fuzz

      - name: Enforce 100% Coverage Threshold
        shell: bash
        run: |
          go test -coverprofile=coverage.out .
          COVERAGE=$(go tool cover -func=coverage.out | grep -E '^total:' | awk '{print $3}' | tr -d '%')
          echo "Current statement coverage: $COVERAGE%"
          if [ "$COVERAGE" != "100.0" ]; then
            echo "::error::Unit test coverage threshold failure: expected 100.0%, got $COVERAGE%"
            exit 1
          fi
          echo "Coverage check passed (100.0%)"


